<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phage Assembly in the Browser</title>
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <main>
    <h1>Assemble reads in your browser</h1>
    <p class="lede">Reads never leave your computer: the assembler runs locally as WebAssembly.</p>

    <form id="asm-form">
      <label>Reads (FASTQ/FASTA, optionally .gz)
        <input id="reads" type="file" multiple accept=".fastq,.fq,.fasta,.fa,.gz">
      </label>
      <div class="row">
        <label>Read type
          <select id="mode">
            <option value="nano-hq" selected>ONT R10 / Q20+ (--nano-hq)</option>
            <option value="nano-corr">ONT corrected (--nano-corr)</option>
            <option value="pacbio-hifi">PacBio HiFi (--pacbio-hifi)</option>
            <option value="illumina">Illumina, paired or single-end (SPAdes --isolate)</option>
          </select>
        </label>
        <label>Threads <input id="threads" type="number" min="1" max="64"></label>
      </div>
      <div class="row" id="spades-options" hidden>
        <label>Max read pairs (0 = all) <input id="maxpairs" type="number" min="0" value="200000"></label>
      </div>
      <div class="row" id="flye-options">
        <label>Genome size <input id="gsize" type="text" placeholder="e.g. 100k"></label>
        <label>Assembly coverage <input id="asmcov" type="number" min="5" placeholder="e.g. 50"></label>
      </div>
      <div class="row buttons">
        <button id="run" type="submit">Assemble</button>
        <button id="cancel" type="button" disabled>Cancel</button>
      </div>
    </form>

    <p id="support" class="note"></p>
    <p>Stage: <strong id="stage">-</strong> &middot; Elapsed: <span id="elapsed">0 s</span></p>
    <p id="status" class="status"></p>
    <div id="downloads"></div>
    <pre id="log"></pre>
  </main>
</body>
</html>
